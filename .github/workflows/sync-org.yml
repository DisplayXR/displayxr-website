name: Sync org data

# Regenerates lib/data/generated/*.json (+ public icons) from the DisplayXR org
# and opens a PR if anything changed. See docs/org-sync.md.
#
#  - schedule          : daily backstop — catches non-release drift (new repos,
#                        new extension headers, new ADRs).
#  - workflow_dispatch : manual "refresh now" button.
#  - repository_dispatch{org-changed} : low-latency hook fired by the runtime's
#                        versions-bump.yml after any component release (Phase 2).

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch:
  repository_dispatch:
    types: [org-changed]

permissions:
  contents: write

concurrency:
  group: sync-org
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate org data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-org.mjs

      # Direct-commit to main — same "released = tested, no review theatre"
      # contract the org's versions.json autobump uses. Pushes by GITHUB_TOKEN
      # don't trigger further workflow runs, and [skip ci] keeps it clean.
      # Vercel redeploys main on push. Editorial drift (new ADRs / repos) shows
      # up in the lib/data/generated/_meta.json diff for a later /sync-website
      # pass — those prose fields are never auto-written.
      - name: Commit refreshed org data to main
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes — org data already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sync): refresh org data

          Auto-generated from the DisplayXR org by sync-org.yml.
          [skip ci]"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
