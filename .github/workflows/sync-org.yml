name: Sync org data

# Regenerates lib/data/generated/*.json (+ public icons) from the DisplayXR org
# and opens a PR if anything changed. See docs/org-sync.md.
#
#  - schedule          : daily backstop — catches non-release drift (new repos,
#                        new extension headers, new ADRs).
#  - workflow_dispatch : manual "refresh now" button.
#  - repository_dispatch{org-changed} : low-latency hook fired by the runtime's
#                        versions-bump.yml after any component release (Phase 2).

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch:
  repository_dispatch:
    types: [org-changed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-org
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate org data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-org.mjs

      - name: Open / update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/org-sync
          base: main
          commit-message: "chore(sync): refresh org data"
          title: "chore(sync): org data refresh"
          labels: org-sync
          delete-branch: true
          body: |
            Automated refresh of `lib/data/generated/*.json` and `public/{demos,engines}/` from the DisplayXR org.

            **Mechanical (this PR):** component versions, demo cards (from each
            demo's `*.displayxr.json` launcher manifest), engine plugin
            versions, extension catalog, repo list.

            **Editorial follow-up:** if a new demo / repo / ADR appears in the
            diff to `lib/data/generated/_meta.json`, the roadmap / architecture
            prose may need a human (or `/sync-website`) pass — those fields are
            never auto-written.

            > Generated by `.github/workflows/sync-org.yml`. Review the diff and merge to publish.
