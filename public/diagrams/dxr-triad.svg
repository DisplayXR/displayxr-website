<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- DisplayXR · Structured Light register · the three layers: Khronos / DisplayXR / Monado -->
  <defs>
    <style>
      .hi   { stroke:#ECEEF2; stroke-opacity:.8;  stroke-width:1.2; fill:none; }
      .lo   { stroke:#9AA0AC; stroke-opacity:.45; stroke-width:1;   fill:none; }
      .guide{ stroke:#9AA0AC; stroke-opacity:.22; stroke-width:1;   fill:none; stroke-dasharray:2 6; }
      .sig  { stroke:#3B82F6; stroke-width:1.8; fill:none; }
      .tick { stroke:#9AA0AC; stroke-opacity:.5; stroke-width:1; }
      .lbl  { fill:#ECEEF2; fill-opacity:.85; font-size:15px; letter-spacing:.18em; }
      .sub  { fill:#9AA0AC; fill-opacity:.8;  font-size:10.5px; letter-spacing:.08em; }
      .bnd  { fill:#3B82F6; font-size:11px; letter-spacing:.18em; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#3B82F6" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#0A0B0E"/>

  <!-- construction -->
  <line class="guide" x1="480" y1="24" x2="480" y2="516"/>
  <g class="tick">
    <line x1="475" y1="40" x2="485" y2="40"/><line x1="480" y1="35" x2="480" y2="45"/>
  </g>

  <!-- KHRONOS -->
  <rect class="hi" x="352" y="64" width="256" height="88" rx="12"/>
  <text class="lbl" x="480" y="102" text-anchor="middle">KHRONOS</text>
  <text class="sub" x="480" y="124" text-anchor="middle">THE STANDARD · RATIFICATION</text>
  <text class="sub" x="480" y="140" text-anchor="middle" opacity=".7">AN API, NOT A CODEBASE</text>

  <!-- DISPLAYXR -->
  <rect class="hi" x="104" y="356" width="300" height="104" rx="12"/>
  <text class="lbl" x="254" y="396" text-anchor="middle">DISPLAYXR</text>
  <text class="sub" x="254" y="418" text-anchor="middle">REFERENCE IMPLEMENTATION</text>
  <text class="sub" x="254" y="434" text-anchor="middle">DESIGN AUTHORITY · INCUBATOR</text>
  <!-- small angled-panel glyph -->
  <polygon class="lo" points="126,374 146,379 146,401 126,406"/>

  <!-- MONADO -->
  <rect class="lo" x="556" y="356" width="300" height="104" rx="12"/>
  <text class="lbl" x="706" y="396" text-anchor="middle" opacity=".75">MONADO</text>
  <text class="sub" x="706" y="418" text-anchor="middle" opacity=".75">AN INDEPENDENT IMPLEMENTATION</text>
  <text class="sub" x="706" y="434" text-anchor="middle" opacity=".6">UPSTREAM-ALIGNED</text>

  <!-- relationships -->
  <line class="lo" x1="404" y1="356" x2="556" y2="356" transform="translate(0,52)" stroke-dasharray="1 4"/>
  <text class="sub" x="480" y="398" text-anchor="middle" opacity=".6">SHARED LINEAGE</text>
  <line class="lo" x1="608" y1="152" x2="706" y2="356" stroke-dasharray="2 6"/>
  <text class="sub" x="712" y="250" opacity=".6">IMPLEMENTS</text>

  <!-- the signal: DisplayXR incubates extensions upward into the standard -->
  <path class="sig" d="M 254 356 C 254 240 352 190 424 152" marker-end="url(#arr)"/>
  <text class="bnd" x="240" y="252" text-anchor="end">XR_DXR_ → EXT → KHR</text>
</svg>
