<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- DisplayXR · Structured Light register · the 4-layer stack
       Palette: ground #0A0B0E · guide #1C1F26 · stroke-lo #9AA0AC · stroke-hi #ECEEF2 · signal #3B82F6 -->
  <defs>
    <style>
      .hi   { stroke:#ECEEF2; stroke-opacity:.8;  stroke-width:1.2; fill:none; }
      .lo   { stroke:#9AA0AC; stroke-opacity:.45; stroke-width:1;   fill:none; }
      .guide{ stroke:#9AA0AC; stroke-opacity:.22; stroke-width:1;   fill:none; stroke-dasharray:2 6; }
      .sig  { stroke:#3B82F6; stroke-width:1.8; fill:none; }
      .tick { stroke:#9AA0AC; stroke-opacity:.5; stroke-width:1; }
      .lbl  { fill:#ECEEF2; fill-opacity:.85; font-size:15px; letter-spacing:.18em; }
      .sub  { fill:#9AA0AC; fill-opacity:.8;  font-size:11.5px; letter-spacing:.14em; }
      .bnd  { fill:#3B82F6; font-size:11.5px; letter-spacing:.22em; }
    </style>
  </defs>

  <rect width="960" height="780" fill="#0A0B0E"/>

  <!-- construction guides -->
  <line class="guide" x1="480" y1="20" x2="480" y2="760"/>
  <line class="guide" x1="140" y1="0"  x2="140" y2="780"/>
  <line class="guide" x1="820" y1="0"  x2="820" y2="780"/>
  <g class="tick">
    <line x1="475" y1="52" x2="485" y2="52"/><line x1="480" y1="47" x2="480" y2="57"/>
    <line x1="135" y1="390" x2="145" y2="390"/><line x1="140" y1="385" x2="140" y2="395"/>
    <line x1="815" y1="390" x2="825" y2="390"/><line x1="820" y1="385" x2="820" y2="395"/>
  </g>

  <!-- APP -->
  <rect class="hi" x="300" y="60" width="360" height="74" rx="10"/>
  <rect class="lo" x="314" y="74" width="46" height="46" rx="5"/>
  <text class="lbl" x="382" y="93">APP</text>
  <text class="sub" x="382" y="114">ANY ENGINE · ANY GRAPHICS API</text>

  <!-- DISPLAYXR RUNTIME -->
  <rect class="hi" x="220" y="212" width="520" height="142" rx="12"/>
  <text class="lbl" x="244" y="246">DISPLAYXR RUNTIME</text>
  <text class="sub" x="244" y="266">OPENXR STATE TRACKER</text>
  <g class="lo">
    <rect x="244" y="284" width="88" height="36" rx="6"/>
    <rect x="340" y="284" width="88" height="36" rx="6"/>
    <rect x="436" y="284" width="88" height="36" rx="6"/>
    <rect x="532" y="284" width="88" height="36" rx="6"/>
    <rect x="628" y="284" width="88" height="36" rx="6"/>
  </g>
  <g class="sub" text-anchor="middle">
    <text x="288" y="307">D3D11</text>
    <text x="384" y="307">D3D12</text>
    <text x="480" y="307">VULKAN</text>
    <text x="576" y="307">METAL</text>
    <text x="672" y="307">OPENGL</text>
  </g>
  <text class="sub" x="244" y="342" opacity=".7">NATIVE COMPOSITORS — NO INTEROP</text>

  <!-- the boundary -->
  <line class="lo" x1="140" y1="420" x2="820" y2="420" stroke-dasharray="7 7"/>
  <text class="bnd" x="140" y="408">XRT_PLUGIN ABI — THE NEUTRAL BOUNDARY</text>
  <text class="sub" x="820" y="408" text-anchor="end" opacity=".7">OPEN ABOVE · VENDOR BELOW</text>

  <!-- VENDOR DISPLAY PROCESSOR -->
  <rect class="hi" x="290" y="486" width="380" height="96" rx="12"/>
  <text class="lbl" x="314" y="522">DISPLAY PROCESSOR</text>
  <text class="sub" x="314" y="543">VENDOR PLUG-IN DLL · WEAVING · CALIBRATION · TRACKING</text>
  <line class="lo" x1="314" y1="556" x2="646" y2="556" stroke-dasharray="1 4"/>

  <!-- 3D DISPLAY: angled panel with nested depth chevrons -->
  <polygon class="hi" points="400,646 588,668 588,740 400,762"/>
  <polygon class="lo" points="414,662 574,681 574,729 414,748"/>
  <path class="lo" d="M 470 684 l 26 20 l -26 20" opacity=".6"/>
  <path class="lo" d="M 492 690 l 18 14 l -18 14" opacity=".4"/>
  <text class="sub" x="612" y="708">3D DISPLAY</text>

  <!-- the signal path -->
  <path class="sig" d="M 480 134 V 212 M 480 354 V 486 M 480 582 V 655"/>
  <g fill="#3B82F6">
    <circle cx="480" cy="173" r="3"/>
    <circle cx="480" cy="420" r="3.6"/>
    <circle cx="480" cy="618" r="3"/>
  </g>
</svg>
